<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>既存患者さん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunken:#e9edf0; --ink:#1b2530; --sub:#5a6775; --line:#dce2e7;
  --ai:#24507a; --ai-weak:#e2ebf4;
  --shu:#bf3f2b; --shu-weak:#fbe8e3;
  --yamabuki:#a86a10; --yamabuki-weak:#faefd8;
  --tokiwa:#2b7556; --tokiwa-weak:#e1f1e9;
  --fuji:#6a4a8c; --fuji-weak:#eee7f5;
  --label-w:176px; --cell:16px; --row:32px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#171f28; --sunken:#1f2933; --ink:#e7ecf0; --sub:#9aa7b4; --line:#2b3642;
    --ai:#86b6e0; --ai-weak:#1c3046;
    --shu:#f08f7d; --shu-weak:#3b201b;
    --yamabuki:#e3b45e; --yamabuki-weak:#3a2e15;
    --tokiwa:#70c5a0; --tokiwa-weak:#173428;
    --fuji:#bca0da; --fuji-weak:#2d233a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#171f28; --sunken:#1f2933; --ink:#e7ecf0; --sub:#9aa7b4; --line:#2b3642;
  --ai:#86b6e0; --ai-weak:#1c3046;
  --shu:#f08f7d; --shu-weak:#3b201b;
  --yamabuki:#e3b45e; --yamabuki-weak:#3a2e15;
  --tokiwa:#70c5a0; --tokiwa-weak:#173428;
  --fuji:#bca0da; --fuji-weak:#2d233a;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.8;resize:vertical}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px}

/* 上部 */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding:26px 0 14px}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;line-height:1.2}
.top .where{color:var(--sub);font-size:13px}
.top .where b{color:var(--ink);font-weight:500}
.top .pick{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
select,input[type=date],input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
input[type=number]{width:4.6em;text-align:right;padding:5px 8px;min-height:34px}

.tabs{display:flex;margin-top:2px;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px 9px;font-weight:500;color:var(--sub);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ai);font-weight:700}

/* 絞り込み */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:16px 0 12px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--sub);font-size:13px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip b{font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--sub)}
.s-ended .dot,.dot.s-ended{background:var(--fuji)} .s-cancelled .dot,.dot.s-cancelled{background:var(--shu)}
.s-nobook .dot,.dot.s-nobook{background:var(--shu)} .s-late .dot,.dot.s-late{background:var(--yamabuki)}
.s-ok .dot,.dot.s-ok{background:var(--tokiwa)}
.note{color:var(--sub);font-size:13px;margin:0 0 12px;max-width:76ch}

/* 担当者の切り替え */
.staffbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 16px}
.staffbar button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;cursor:pointer;text-align:left;min-width:112px}
.staffbar button span{display:block;font-weight:700;font-size:15px;white-space:nowrap}
.staffbar button small{display:block;font-size:12px;color:var(--sub);white-space:nowrap}
.staffbar button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.staffbar button[aria-pressed=true] small{color:var(--bg);opacity:.75}
.staffbar.area{padding-bottom:10px}
.staffbar.area button{border-radius:10px;border-left:4px solid var(--ai)}
.staffbar.area button[aria-pressed=true]{border-left-color:var(--ink)}
.storebar{padding:0 0 14px}
.storebar .chip small{color:var(--sub);font-size:11px}
.storebar .chip{min-height:34px}
.guide{margin:16px 0 14px;font-size:14px;max-width:70ch}
.card.sum{margin-bottom:20px;padding-bottom:12px}
.card.sum td,.card.sum th{white-space:nowrap}
.lk{background:none;border:0;padding:0;font-weight:700;color:var(--ai);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.n{display:inline-block;min-width:2.1em;text-align:center;border-radius:6px;padding:0 6px;font-weight:700}
.n.s-ended{background:var(--fuji-weak);color:var(--fuji)} .n.s-cancelled,.n.s-nobook{background:var(--shu-weak);color:var(--shu)}
.n.s-late{background:var(--yamabuki-weak);color:var(--yamabuki)} .n.s-ok{background:var(--tokiwa-weak);color:var(--tokiwa)} .n.s-away{background:var(--sunken);color:var(--sub)}
details.group{margin:0 0 18px}
details.group summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 4px}
details.group summary::-webkit-details-marker{display:none}
details.group summary .gt{font-size:17px;font-weight:700}
details.group summary b{font-size:17px}
details.group summary b::after{content:"　開く";font-size:12px;font-weight:500;color:var(--ai)}
details.group[open] summary b::after{content:"　閉じる"}
details.group summary small{grid-column:2/-1;color:var(--sub);font-size:13px}
details.group.s-other .dot{background:var(--sub)}
details.critbox{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 18px}
details.critbox summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--ai)}
details.critbox[open]{padding-bottom:16px}
table.crit td:first-child{white-space:nowrap;width:1%} table.crit th{padding-top:12px;color:var(--ink);font-weight:700;font-size:13px}
table.crit tr:first-child th{padding-top:0}
.minbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 4px 10px;font-size:13px;color:var(--sub)}
.minbar .seg{flex-wrap:wrap} .minbar .seg button{min-height:34px}
details.group summary b .of{font-style:normal;font-weight:500;font-size:13px;color:var(--sub)}
.ct{display:inline-block;margin-left:6px;border-radius:6px;padding:0 7px;font-size:11px;font-weight:700;background:var(--ai-weak);color:var(--ai);white-space:nowrap}
.ct.back{background:var(--tokiwa-weak);color:var(--tokiwa)}
.ctbtns{display:flex;gap:8px;flex-wrap:wrap} .ctbtns .btn{min-height:42px;padding:8px 16px}
table.ctlog{margin-top:8px}
h3.sub{margin:14px 4px 8px;font-size:15px} h3.sub b{margin-left:6px} h3.sub small{display:block;font-weight:400;font-size:12px;color:var(--sub)}

.warn{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--yamabuki-weak);color:var(--yamabuki);font-size:13px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;max-width:calc(100vw - 24px);box-shadow:0 6px 24px rgba(10,20,30,.3)}
.seg.pace{flex-wrap:wrap} .seg.pace button{padding:8px 14px;font-size:14px;min-height:40px}
.seg.pace button[aria-pressed=true]{background:var(--ai);color:var(--surface)}
button:disabled,input:disabled{opacity:.55;cursor:not-allowed}

/* 一覧 */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(150px,1.3fr) 110px 120px 110px minmax(200px,2fr);gap:4px 14px;align-items:center;
  padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow.head{cursor:default;color:var(--sub);font-size:12px;padding:8px 16px;background:var(--sunken)}
.lrow[data-id]:hover{background:var(--sunken)}
.lrow.alert{background:var(--shu-weak)} .lrow.alert:hover{background:color-mix(in srgb,var(--shu-weak) 85%,var(--shu))}
.alertsw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--shu-weak);box-shadow:inset 0 0 0 1px var(--shu);vertical-align:-2px;margin-right:6px}
.lrow.hasact{grid-template-columns:minmax(150px,1.3fr) 104px 104px 96px minmax(170px,2fr) 156px}
.acts.in-who{display:none} .acts.at-end{justify-content:flex-end} .lrow.head .acth{text-align:right}
.nmbox{min-width:0;display:block;flex:0 1 auto}
.lrow.hasact .nmbox .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex:none;margin-left:4px}
.lrow.head .hint{font-style:normal;margin-left:6px}
.tick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:36px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tick i{width:16px;height:16px;border:2px solid var(--sub);border-radius:4px;display:inline-block;position:relative;flex:none}
.tick[aria-pressed=true]{border-color:var(--tokiwa);background:var(--tokiwa-weak);color:var(--tokiwa)}
.tick[aria-pressed=true] i{background:var(--tokiwa);border-color:var(--tokiwa)}
.tick[aria-pressed=true] i::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.toast .lk{color:var(--bg);margin-left:8px}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small,.lrow small{color:var(--sub);font-size:12px;display:block;line-height:1.35}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--ai-weak);color:var(--ai);white-space:nowrap}
.tag.soon{background:var(--yamabuki-weak);color:var(--yamabuki)}
.st{font-size:13px}
.st b{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
.s-ended .st b{background:var(--fuji-weak);color:var(--fuji)} .s-cancelled .st b,.s-nobook .st b{background:var(--shu-weak);color:var(--shu)}
.s-late .st b{background:var(--yamabuki-weak);color:var(--yamabuki)} .s-ok .st b{background:var(--tokiwa-weak);color:var(--tokiwa)}
.empty{padding:36px 16px;text-align:center;color:var(--sub)}

/* 来院カレンダー（帯グラフ） */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--sub);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:72vh;position:relative}
.strip-in{position:relative;width:max-content;min-width:100%}
.srow{display:flex;height:var(--row);border-top:1px solid var(--line)}
.srow.hd{height:44px;position:sticky;top:0;z-index:4;background:var(--sunken);border-top:0}
.slabel{position:sticky;left:0;z-index:3;width:var(--label-w);flex:none;background:var(--surface);border:0;border-right:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left;cursor:pointer;min-width:0}
.srow.hd .slabel{background:var(--sunken);cursor:default;font-size:12px;color:var(--sub);z-index:5}
.slabel .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.slabel .tk{font-size:11px;color:var(--sub);white-space:nowrap}
.track{position:relative;flex:none}
.srow:not(.hd) .track{background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(var(--cell)*7) 100%}
.mlab{position:absolute;top:4px;font-size:12px;font-weight:700;white-space:nowrap}
.dlab{position:absolute;bottom:4px;font-size:10px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--sub);opacity:.35;z-index:1;pointer-events:none}
.vline.today{border-left:2px solid var(--ink);opacity:.8}
.todaylab{position:absolute;top:4px;font-size:10px;background:var(--ink);color:var(--bg);padding:0 5px;border-radius:4px;transform:translateX(-50%);z-index:2;white-space:nowrap}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%)}
.mk.v{width:10px;height:10px;border-radius:50%;background:var(--ai);z-index:2}
.mk.v.buy{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ai)}
.mk.v.end{background:var(--fuji)}
.mk.b{width:11px;height:11px;border-radius:50%;border:2px solid var(--ai);background:var(--surface);z-index:2}
.mk.b.unv{border-style:dashed}
.mk.x{color:var(--shu);font-size:13px;font-weight:700;line-height:1;z-index:2}
.band{position:absolute;top:50%;height:16px;transform:translateY(-50%);border-radius:8px;background:var(--ai-weak)}
.band.over{background:var(--shu-weak);box-shadow:inset 0 0 0 1px var(--shu)}
.link{position:absolute;top:50%;height:0;border-top:1px solid var(--ai);opacity:.45}
.link.dash{border-top-style:dashed}

/* 更新見込み */
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.card h2{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 12px;color:var(--sub);font-size:13px}
.bars{display:grid;gap:4px;margin-top:8px}
.brow{display:grid;grid-template-columns:96px 1fr 44px;white-space:nowrap;gap:10px;align-items:center;background:none;border:0;padding:4px 6px;border-radius:8px;cursor:pointer;text-align:left}
.brow:hover,.brow[aria-pressed=true]{background:var(--sunken)}
.brow i{display:block;height:18px;border-radius:4px;background:var(--ai);min-width:3px}
.brow span:last-child{text-align:right;font-weight:700}
.split{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:10px 0 8px;background:var(--sunken)}
.split i{display:block} .split .a{background:var(--tokiwa)} .split .b{background:var(--fuji)}
.kv{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:10px}
.kv b{font-size:22px;color:var(--ink);margin-right:3px}
.mini{display:grid;gap:0;margin-top:6px}
.mini button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;text-align:left;font-size:13px}
.mini button:hover{background:var(--sunken)}
.mini small{color:var(--sub)}

/* 設定 */
.rule{line-height:2.5}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--sub);margin:10px 0}
.drop.on{border-color:var(--ai);background:var(--ai-weak)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:38px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.facts{margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--sub)}
.facts li{padding:5px 0;border-top:1px solid var(--line)} .facts b{color:var(--ink)}
ul.plain{margin:0;padding-left:1.2em;font-size:13px;color:var(--sub)} ul.plain li{margin:5px 0}
#loadmsg{font-size:13px;margin:8px 0 0}
.noedit{border:1px solid var(--yamabuki);background:var(--yamabuki-weak);color:var(--ink);border-radius:12px;padding:16px 18px;margin:0 0 10px;font-size:14px;line-height:1.8} .noedit b{display:block;color:var(--yamabuki);margin-bottom:4px}
.drop.big{padding:34px 18px;margin:0 0 10px} .drop.big span{display:inline-block;margin-top:10px;font-size:13px}
.steps{margin:0;padding-left:1.5em;font-size:15px} .steps>li{margin:0 0 12px;padding-left:4px} .steps>li::marker{font-weight:700;color:var(--ai)}
.steps small,.first{display:block;color:var(--sub);font-size:12px;line-height:1.6;margin-top:3px}
.ticks{list-style:none;margin:8px 0 6px;padding:10px 14px;background:var(--sunken);border-radius:10px;display:grid;gap:6px;font-weight:700}
.ticks li::before{content:"✓";display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;margin-right:10px;border-radius:5px;background:var(--ai);color:var(--surface);font-size:13px}
.period{display:inline-block;background:var(--ai-weak);color:var(--ai);border-radius:6px;padding:1px 8px;white-space:nowrap}
.first{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px} .first b{color:var(--ink)}
.grid2.csv{grid-template-columns:1fr 1fr}

/* 患者さんの詳細 */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:min(88vh,900px);box-shadow:0 18px 60px rgba(10,20,30,.35)}
dialog::backdrop{background:rgba(10,18,26,.5)}
.dh{position:sticky;top:0;background:var(--surface);padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;z-index:2}
.dh h2{margin:0;font-size:20px;line-height:1.3} .dh small{color:var(--sub);font-size:13px;display:block}
.dh .x{margin-left:auto;background:var(--sunken);border:0;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;flex:none}
.db{padding:16px 22px 24px}
.db h3{font-size:14px;margin:20px 0 8px}
.say{border-left:4px solid var(--sub);padding:8px 12px;background:var(--sunken);border-radius:0 8px 8px 0;font-size:14px}
.say.s-ended{border-color:var(--fuji)} .say.s-cancelled,.say.s-nobook{border-color:var(--shu)} .say.s-late{border-color:var(--yamabuki)} .say.s-ok{border-color:var(--tokiwa)}
.cals{display:flex;gap:18px;flex-wrap:wrap}
.cal{width:224px} .cal h4{margin:0 0 4px;font-size:13px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:12px;text-align:center}
.cal .w{color:var(--sub);font-size:10px}
.cal .c{height:28px;line-height:28px;border-radius:14px;position:relative}
.cal .c.win{background:var(--ai-weak);border-radius:4px} .cal .c.win.over{background:var(--shu-weak)}
.cal .c.v{background:var(--ai);color:var(--surface);font-weight:700} .cal .c.v.end{background:var(--fuji)}
.cal .c.bk{box-shadow:inset 0 0 0 2px var(--ai);font-weight:700;background:var(--surface)}
.cal .c.cx{color:var(--shu);text-decoration:line-through;font-weight:700}
.cal .c.td{outline:2px solid var(--ink);outline-offset:-2px;border-radius:4px}
.cal-lg{margin:12px 0 0}
.sw{display:inline-block;width:18px;height:18px;border-radius:9px;flex:none}
.sw.v{background:var(--ai)} .sw.bk{box-shadow:inset 0 0 0 2px var(--ai)}

<script>
/* ===== 集計ロジック（画面とは独立） ===== */
const DAY_MS = 86400000;

function toDay(s) {
  if (!s) return null;
  const m = String(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if (!m) return null;
  return Math.round(Date.UTC(+m[1], +m[2] - 1, +m[3]) / DAY_MS);
}
function dayToDate(n) { return new Date(n * DAY_MS); }
function dayISO(n) { return dayToDate(n).toISOString().slice(0, 10); }

/* RFC4180 準拠の最小CSVパーサ。1行目を見出しとして、行ごとのオブジェクトを返す */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return { cols: [], rows: [] };
  const cols = rows[0].map(s => s.trim());
  return { cols, rows: rows.slice(1) };
}

/* 見出しからファイルの種類を判定する（ファイル名には頼らない） */
function detectType(cols) {
  const has = c => cols.includes(c);
  if (has('予約ID') && has('来店日時') && has('削除済み')) return '予約';
  if (has('明細ID') && has('品目名')) return '精算アイテム';
  if (has('会計ID') && has('予約ID')) return '精算';
  if (has('顧客ID') && has('氏名')) return '顧客';
  if (has('スタッフID') && has('氏名')) return 'スタッフ';
  return null;
}

function emptyData() {
  return { res: new Map(), pay: new Map(), items: new Map(), cust: new Map() };
}

/* 表（cols, rows）をデータに取り込む。同じIDは上書きするので、期間を足して読み込める */
function ingest(data, type, table, fallback) {
  const idx = {}; table.cols.forEach((c, i) => { idx[c] = i; });
  const g = (row, c) => (idx[c] === undefined ? '' : (row[idx[c]] || '').trim());
  let n = 0;
  for (const row of table.rows) {
    if (type === '予約') {
      const id = g(row, '予約ID'), day = toDay(g(row, '来店日時'));
      if (!id || day === null) continue;
      const nx = g(row, '次回予約までの日数');
      data.res.set(id, {
        id, day, cust: g(row, '顧客ID'),
        store: g(row, '店舗名') || (fallback && fallback.store) || '',
        staff: g(row, '担当スタッフ名').replace(/\s+/g, ' ') || '担当なし',
        isNew: g(row, '新規顧客') === '1', deleted: g(row, '削除済み') === '1',
        next: nx === '' ? null : Number(nx),
      });
    } else if (type === '精算') {
      const id = g(row, '会計ID'); if (!id) continue;
      data.pay.set(id, { id, res: g(row, '予約ID'), cust: g(row, '顧客ID') });
    } else if (type === '精算アイテム') {
      const id = g(row, '明細ID'); if (!id) continue;
      data.items.set(id, { id, acct: g(row, '会計ID'), kind: g(row, '区分'), name: g(row, '品目名') });
    } else if (type === '顧客') {
      const id = g(row, '顧客ID'); if (!id) continue;
      data.cust.set(id, { id, name: g(row, '氏名'), kana: g(row, '氏名カナ') }); // 氏名以外の個人情報は保持しない
    } else continue;
    n++;
  }
  return n;
}

const RE_USE = /回数券\s*(消化|更新)\s*([A-Za-z]*)\s*(\d+)/;
const RE_BUY = /([A-Za-z]*)\s*(\d+)\s*回(?:数券|券|数)/; // 「S10回券」のほか、分割払いの「S10回数券」も購入の行として読む
const RE_USE3 = /^\s*([A-Za-z]+)\s*(\d+)\s*回券/;        // 施術メニューとして登録された「R3回券」は、その回数券の1回分
const RE_HALF = /0\.5\s*回分/;

const DEFAULT_SETTINGS = { b1: 6, d1: 7, b2: 12, d2: 14, d3: 28, renewDays: 14, tol: 3, soon: 3, awayDays: 60, alertDays: 30, startDay: '' };
const PACE_CHOICES = [7, 14, 21, 28];

/* 初めての回数券の n回目（1始まり）の前に空ける目安日数 */
function stagedInterval(n, st) {
  if (n <= st.b1) return st.d1;
  if (n <= st.b2) return st.d2;
  return st.d3;
}
/* 更新した回数券の初期ペース：更新前の来院間隔（直近3回の中央値）を、週1・2週・3週・月1のいちばん近いものに丸める */
function autoRenewDays(visitDays, start, st) {
  const ds = visitDays.filter(d => d <= start), gaps = [];
  for (let i = 1; i < ds.length; i++) gaps.push(ds[i] - ds[i - 1]);
  const g = gaps.slice(-3).sort((a, b) => a - b);
  if (!g.length) return { days: st.renewDays, from: null };
  const med = g[Math.floor(g.length / 2)];
  let best = PACE_CHOICES[0];
  for (const c of PACE_CHOICES) if (Math.abs(c - med) < Math.abs(best - med)) best = c;
  return { days: best, from: med };
}

function buildModel(data, settings, asOf, pace, asOfByStore) {
  pace = pace || {}; asOfByStore = asOfByStore || {};
  const st = Object.assign({}, DEFAULT_SETTINGS, settings || {});
  const maxIvl = Math.max(st.d1, st.d2, st.d3, st.renewDays);
  const startDay = st.startDay ? toDay(st.startDay) : null;

  const acctByRes = new Map();
  for (const p of data.pay.values()) {
    if (!acctByRes.has(p.res)) acctByRes.set(p.res, []);
    acctByRes.get(p.res).push(p.id);
  }
  const itemsByAcct = new Map();
  for (const it of data.items.values()) {
    if (!itemsByAcct.has(it.acct)) itemsByAcct.set(it.acct, []);
    itemsByAcct.get(it.acct).push(it);
  }

  const byCust = new Map();
  let dataStart = Infinity, dataEnd = -Infinity;
  for (const r of data.res.values()) {
    if (!r.cust) continue;
    if (!byCust.has(r.cust)) byCust.set(r.cust, []);
    byCust.get(r.cust).push(r);
    if (r.day < dataStart) dataStart = r.day;
    if (r.day > dataEnd) dataEnd = r.day;
  }

  const everyone = startDay === null || startDay < dataStart; // 開始日が空か、データより前の日付なら、購入日が分からない人も対象
  const patients = [];
  for (const [cid, rows] of byCust) {
    const asOfP = asOfByStore[rows[0].store] !== undefined ? asOfByStore[rows[0].store] : asOf; // 院ごとに、CSVを読み込んだ日で判定する
    const days = new Map();
    for (const r of rows) {
      if (!days.has(r.day)) days.set(r.day, { valid: [], deleted: [] });
      days.get(r.day)[r.deleted ? 'deleted' : 'valid'].push(r);
    }
    const dayKeys = [...days.keys()].sort((a, b) => a - b);

    const visits = [], cancels = [], futures = [];
    for (const d of dayKeys) {
      const { valid, deleted } = days.get(d);
      if (!valid.length) { cancels.push(d); continue; }
      if (d > asOfP) { futures.push(d); continue; }
      const names = [], buys = [];
      let use = null, uses = 0, useW = 0, renewItem = false, staff = valid[0].staff;
      for (const r of valid) {
        for (const a of acctByRes.get(r.id) || []) {
          for (const it of itemsByAcct.get(a) || []) {
            names.push(it.name);
            const nm = it.name.normalize('NFKC'); // 全角の数字や英字（R３ など）を半角にそろえて読む
            const mu = it.kind !== '2' && (nm.match(RE_USE) || (it.kind === '1' && nm.match(RE_USE3)));
            if (mu) {
              const isMenu = mu.length === 3; // RE_USE3 に当たった場合
              uses++; useW += RE_HALF.test(nm) ? 0.5 : 1; // 「0.5回分」は半分だけ数える
              use = isMenu ? { type: mu[1].toUpperCase() + mu[2], N: +mu[2] } : { type: mu[2].toUpperCase() + mu[3], N: +mu[3] };
              if (!isMenu && mu[1] === '更新') renewItem = true;
              staff = r.staff;
            } else if (it.kind === '2') {
              const mb = nm.match(RE_BUY);
              if (mb) buys.push({ type: mb[1] ? mb[1].toUpperCase() + mb[2] : mb[2] + '回券', N: +mb[2], generic: !mb[1] });
            }
          }
        }
      }
      visits.push({ day: d, staff, names, use, uses, useW, renewItem, buys, isNew: valid.some(r => r.isNew), store: valid[0].store });
    }

    /* 回数券の流れを組み立てる */
    const tickets = [];
    let cur = null;
    const open = (type, N, start, known) => {
      cur = { type, N, start, known, uses: [], usedSum: 0, pays: 1, ended: false, endDay: null, renewal: false, mixed: false, noBuyRecord: false };
      tickets.push(cur); return cur;
    };
    const addUse = (v) => {
      if (!cur || cur.ended) {
        const afterEnd = !!(cur && cur.ended);
        open(v.use.type, v.use.N, afterEnd ? v.day : null, afterEnd);
        if (afterEnd) { cur.renewal = true; cur.noBuyRecord = true; }
      }
      if (cur.type !== v.use.type) {
        if (cur.generic && cur.N === v.use.N) { cur.type = v.use.type; cur.generic = false; } // 券種の記号がない購入は、最初の消化メニューの名前に合わせる
        else { cur.mixed = true; if (!cur.known) { cur.type = v.use.type; cur.N = v.use.N; } }
      }
      for (let i = 0; i < v.uses; i++) cur.uses.push(v.day);
      cur.usedSum += v.useW;
      if (cur.known && cur.usedSum >= cur.N) { cur.ended = true; cur.endDay = v.day; }
    };
    for (const v of visits) {
      const hadTicket = tickets.length > 0;
      if (v.renewItem) {              // 「回数券更新」＝いまの券の最後の1回として数える
        addUse(v); cur.ended = true; cur.endDay = v.day; cur.renewPoint = true;
      }
      /* 回数券が残っているあいだに同じ券種の購入の行が出たら、分割払いの2回目以降とみなして、新しい券は始めない */
      const instalment = v.buys.length && cur && cur.known && !cur.ended && !v.renewItem && v.buys.every(b => b.type === cur.type || b.type === v.buys[0].type && cur.type === b.type.replace(/\d+$/, '') + cur.N);
      if (instalment) { cur.pays += 1; if (v.use) addUse(v); }
      else if (v.buys.length) {
        const N = v.buys.reduce((s, b) => s + b.N, 0);
        if (cur && !cur.ended) { cur.ended = true; cur.endDay = v.day; cur.superseded = true; }
        const prev = cur;
        open(v.buys.length > 1 && v.buys.every(b => b.type === v.buys[0].type) && v.buys[0].type.match(/^[A-Z]/) ? v.buys[0].type.replace(/\d+$/, '') + N : v.buys[0].type, N, v.day, true);
        cur.generic = !!v.buys[0].generic;
        cur.renewal = v.renewItem || (hadTicket && !v.isNew);
        cur.multi = v.buys.length > 1;
        if (prev && prev.renewPoint) prev.renewed = true;
        if (v.use && !v.renewItem) addUse(v); // 購入日の「消化」は新しい券の1回目
      } else if (v.use && !v.renewItem) addUse(v);
    }

    const tk = tickets.length ? tickets[tickets.length - 1] : null;
    const last = visits.length ? visits[visits.length - 1] : null;

    /* 次回予約：まず実データ（未来の有効な予約）。なければ「次回予約までの日数」を、キャンセル済みを飛ばしながらたどる */
    let booking = null, cancelledNext = null;
    if (futures.length) booking = { day: futures[0], unverified: false };
    else if (last) {
      let c = last.day, src = days.get(c).valid, guard = 0;
      while (guard++ < 20) {
        const pos = src.map(r => r.next).filter(x => x !== null && x > 0);
        if (!pos.length) break;
        const c2 = c + Math.min(...pos);
        const slot = days.get(c2);
        if (slot && !slot.valid.length && slot.deleted.length) { cancelledNext = c2; c = c2; src = slot.deleted; continue; }
        if (slot && slot.valid.length) break; // データ上は来院済みのはずなので、ここには来ない
        booking = { day: c2, unverified: true }; // データ期間の外にある予約（キャンセルされたかは確認できない）
        break;
      }
    }
    if (booking) cancelledNext = null;
    if (!booking && !cancelledNext && last) { const later = cancels.filter(d => d > last.day); if (later.length) cancelledNext = later[later.length - 1]; } // 前回の来院より後のキャンセルは、あとから読み込んだ分も拾う

    const visitDays = visits.map(v => v.day);
    const gaps = []; for (let i = 1; i < visitDays.length; i++) gaps.push(visitDays[i] - visitDays[i - 1]);

    const p = {
      id: cid, asOf: asOfP, name: (data.cust.get(cid) || {}).name || '', staff: last ? last.staff : (rows[0].staff || '担当なし'),
      store: rows[0].store, visits, cancels, futures, tickets, tk, last, booking, cancelledNext, gaps,
      isTicket: !!tk, isNew: visits.some(v => v.isNew),
      used: null, seen: 0, remaining: null, target: null, limit: null, overdue: null, plan: [], endDay: null,
      status: 'none', renewSoon: false,
      tracked: tickets.some(t => t.known && (startDay === null || t.start >= startDay)) || (everyone && !!tk), pace: null, was: null,
    };
    /* この患者さんの来院ペース：個別に選んだもの → 更新の回数券は更新前の実績 → 初めての回数券は段階ペース */
    const manual = Number(pace[cid]) > 0 ? Number(pace[cid]) : null;
    const auto = !tk ? null : !tk.known ? Object.assign(autoRenewDays(visitDays, Infinity, st), { own: true }) // 購入日が分からない人は、これまでの来院間隔から
      : tk.renewal ? autoRenewDays(visitDays, tk.start, st) : null;
    const ivl = n => manual || (auto ? auto.days : stagedInterval(n, st));

    unsubs.push(FB.watchList('stores', list => {
      const f = isFirst; isFirst = false;
      onMetas(list, f).then(() => { if (f) firstDone(); }, () => { if (f) firstDone(); });
    }, () => { state.dbState = 'error'; firstDone(); }));
  } else {
    const ss = myStores(), got = {}; let n = 0;
    if (!ss.length) firstDone();
    for (const s of ss) {
      let isFirst = true;
      unsubs.push(FB.watch('stores/' + s, x => {
        got[s] = x;
        if (isFirst) { isFirst = false; if (++n === ss.length) onMetas(ss.filter(k => got[k]).map(k => ({ id: k, data: got[k] })), true).then(firstDone, firstDone); else return; }
        else onMetas(ss.filter(k => got[k]).map(k => ({ id: k, data: got[k] })), false);
      }, () => { if (isFirst) { isFirst = false; if (++n === ss.length) firstDone(); } }));
    }
  }
  await first;
  if (state.dbState === 'loading') state.dbState = 'ready';
  if (wantWho) { state.store = wantWho.store || ''; state.staff = wantWho.staff || ''; wantWho = null; }
  rebuild();
}

/* 入口の画面（ログイン／確認待ち／未登録） */
function gate(kind, msg) {
  state.gate = kind;
  const g = $('#gate'), app = $('#app');
  g.hidden = !kind; app.hidden = !!kind;
  if (!kind) return;
  const setup = location.hash === '#setup';
  const box = inner => `<div class="gatecard"><h1>既存患者さん</h1><p class="gsub">整体KOTOBUKI　来院ペースと要フォローの確認</p>${inner}${msg ? `<p class="gmsg">${esc(msg)}</p>` : ''}</div>`;
  if (kind === 'loading') g.innerHTML = box('<p>読み込み中です…</p>');
  else if (kind === 'fail') g.innerHTML = box('<p>アプリを読み込めませんでした。通信状態を確認して、ページを開き直してください。</p>');
  else if (kind === 'login') g.innerHTML = box(setup
    ? `<form id="fSetup"><p>管理者のアカウントを作ります（最初の1回だけ）。</p>
      <label>メールアドレス<input type="email" name="email" autocomplete="username" required></label>
      <label>パスワード（8文字以上）<input type="password" name="pw" autocomplete="new-password" minlength="8" required></label>
      <label>パスワード（もう一度）<input type="password" name="pw2" autocomplete="new-password" minlength="8" required></label>
      <button class="btn wide">アカウントを作る</button></form>
      <p class="galt"><a href="#" data-act="toLogin">ログインに戻る</a></p>`
    : `<form id="fLogin">
      <label>メールアドレス<input type="email" name="email" autocomplete="username" required></label>
      <label>パスワード<input type="password" name="pw" autocomplete="current-password" required></label>
      <button class="btn wide">ログイン</button></form>
      <p class="galt"><button class="lk" data-act="forgot">パスワードを忘れた・まだ決めていない</button></p>
      <p class="gnote">アカウントは、エリマネか管理者が登録します。登録されると「パスワードの再設定」のメールが届くので、そこでパスワードを決めてください。メールが見つからないときは、迷惑メールのフォルダも見てください。</p>`);
  else if (kind === 'verify') g.innerHTML = box(`<p><b>${esc(FB.auth.currentUser.email)}</b> に確認のメールを送りました。メールのリンクを押してから、下のボタンを押してください。</p>
      <p><button class="btn wide" data-act="verified">確認しました</button></p>
      <p class="galt"><button class="lk" data-act="resend">確認メールをもう一度送る</button>　<button class="lk" data-act="logout">ログアウト</button></p>`);
  else if (kind === 'nomember') g.innerHTML = box(`<p><b>${esc(FB.auth.currentUser.email)}</b> は、まだ使える人として登録されていません。エリマネか管理者に、このメールアドレスで登録してもらってください。</p>
      <p class="galt"><button class="lk" data-act="logout">ログアウト</button></p>`);
}
const AUTH_MSG = {
  'auth/invalid-credential': 'メールアドレスかパスワードが違います。', 'auth/wrong-password': 'メールアドレスかパスワードが違います。', 'auth/user-not-found': 'メールアドレスかパスワードが違います。',
  'auth/invalid-email': 'メールアドレスの形が正しくありません。', 'auth/too-many-requests': '何度も失敗したため、しばらくログインできません。少し時間をおいてください。',
  'auth/email-already-in-use': 'このメールアドレスは、もう登録されています。ログインしてください。', 'auth/weak-password': 'パスワードは8文字以上にしてください。',
  'auth/network-request-failed': '通信できませんでした。電波の状態を確認してください。',
};
const authMsg = e => AUTH_MSG[e && e.code] || 'うまくいきませんでした。もう一度お試しください。';
const backUrl = () => location.origin + location.pathname;

async function onUser(user) {
  for (const u of unsubs) { try { u(); } catch (e) { /* もう止まっている */ } }
  unsubs = []; watched.clear();
  if (!user) { state.me = null; gate('login'); return; }
  gate('loading');
  const email = String(user.email || '').toLowerCase();
  let me = null;
  try { me = await FB.get('members/' + email); } catch (e) { me = null; }
  if (!me) { // 管理者の最初の1回：自分を管理者として登録する（ルールで決めたアドレスだけが成功する）
    try { await FB.set('members/' + email, { name: '管理者', role: 'admin', stores: [], addedBy: email, addedAt: new Date().toISOString() }); me = await FB.get('members/' + email); } catch (e) { me = null; }
  }
  if (!me) { gate(user.emailVerified ? 'nomember' : 'verify'); return; }
  state.me = Object.assign({ email }, me);
  unsubs.push(FB.watch('members/' + email, x => { // 役割や担当の院が変わったら、読み込み直す
    if (!x) { location.reload(); return; }
    if (x.role !== state.me.role || JSON.stringify(x.stores || []) !== JSON.stringify(state.me.stores || [])) location.reload();
    else { state.me = Object.assign({ email }, x); renderMe(); }
  }, () => {}));
  if (canUpload()) unsubs.push(FB.watchList('members', list => { state.members = list; if (state.tab === 'mem') render(); }, () => {}));
  if (location.hash === '#setup') history.replaceState(null, '', location.pathname);
  gate(null); renderMe();
  if (state.tab === 'mem' && !canUpload()) state.tab = 'follow';
  await startData();
}
function renderMe() {
  const m = state.me, b = $('#meBox'); if (!b) return;
  b.hidden = !m;
  if (m) b.innerHTML = `<span>${esc(m.name && m.name !== ROLE[m.role] ? m.name : m.email)}<small>${ROLE[m.role] || ''}</small></span><button class="btn ghost sm" data-act="logout">ログアウト</button>`;
  const t = $('#tabMem'); if (t) t.hidden = !canUpload();
}
async function boot() {
  gate('loading');
  try { FB = await Promise.race([fbReady, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))]); }
  catch (e) { gate('fail'); return; }
  FB.onAuth(u => { onUser(u).catch(() => { state.dbState = 'error'; rebuild(); }); });
}
window.addEventListener('hashchange', () => { if (state.gate === 'login') gate('login'); });
async function logout() { await cacheClear(); try { localStorage.removeItem('raiin-who'); } catch (e) { /* なくてもよい */ } await FB.signOut(); location.replace(location.pathname); }
document.addEventListener('submit', async e => {
  const f = e.target; if (!f.id || !/^f(Login|Setup)$/.test(f.id)) return;
  e.preventDefault();
  const email = f.email.value.trim(), btn = f.querySelector('button'); btn.disabled = true;
  try {
    if (f.id === 'fLogin') await FB.signIn(email, f.pw.value);
    else {
      if (f.pw.value !== f.pw2.value) { gate('login', '2つのパスワードが同じではありません。'); return; }
      await FB.signUp(email, f.pw.value, backUrl());
    }
  } catch (err) { gate('login', authMsg(err)); }
});
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'logout') { e.preventDefault(); logout(); }
  else if (act === 'toLogin') { e.preventDefault(); history.replaceState(null, '', location.pathname); gate('login'); }
  else if (act === 'forgot') {
    const f = $('#fLogin'), email = f ? f.email.value.trim() : '';
    if (!email) { gate('login', '上の欄にメールアドレスを入れてから、もう一度押してください。'); return; }
    try { await FB.reset(email, backUrl()); gate('login', `${email} に、パスワードを決めるメールを送りました（登録されているアドレスの場合）。メールのリンクから新しいパスワードを決めて、ここに戻ってログインしてください。`); }
    catch (err) { gate('login', authMsg(err)); }
  }
  else if (act === 'resend') { try { await FB.resendVerify(backUrl()); gate('verify', '確認のメールを送り直しました。'); } catch (err) { gate('verify', authMsg(err)); } }
  else if (act === 'verified') { try { const u = await FB.refresh(); if (!u.emailVerified) { gate('verify', 'まだ確認が終わっていないようです。メールのリンクを押してから、もう一度押してください。'); return; } onUser(u); } catch (err) { gate('verify', authMsg(err)); } }
});

function rebuild() {
  model = buildModel(data, state.settings, state.asOf, state.pace, state.asOfByStore);
  renderChrome();
  const ae = document.activeElement;
  if (!((state.tab === 'set' || state.tab === 'csv') && ae && ae.closest && ae.closest('#view') && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) render(); // 入力中の欄は作り直さない
  if ($('#dlg').open && state.openId) openPatient(state.openId, true);
}

const LABEL = { ended: '更新せず終了', cancelled: 'キャンセルしたまま', nobook: '次回予約なし', late: '間隔が空きすぎ', ok: '順調', away: 'しばらく来ていない', none: '来院なし' };
const SEVERITY = { cancelled: 0, nobook: 1, late: 2, ok: 3, ended: 4, away: 5, none: 6 };
const done = p => !!(p.tk && p.tk.ended); // 回数券が終了している
const ATTN = ['cancelled', 'nobook', 'late']; // 要フォローに数える状態
const GROUPS = [
  { k: 'cancelled', title: '予約をキャンセルしたままの患者さん', help: '次の予約をキャンセルしたあと、取り直していません。', open: true },
  { k: 'nobook', title: '次回予約が入っていない患者さん', help: '回数券が残っているのに、次の予約がありません。最後の来院から日数が経っている順です。', open: true },
  { k: 'late', title: '予約はあるが、間隔が空きすぎの患者さん', help: '次の予約が、目安のペースより先の日付になっています。', open: true },
  { k: 'ok', title: '順調な患者さん', help: '目安のペースどおりに次の予約が入っています。', open: false },
  { k: 'ended', title: '更新せずに終わった患者さん', help: '回数券が終了したあと、新しい回数券の購入記録がありません。要フォローの人数には入れていません。', open: false },
  { k: 'away', title: 'しばらく来ていない患者さん', help: '最後の来院から{n}日以上たっていて、次の予約がありません。要フォローの人数には入れていません。回数券の残りで分けて、最近まで来ていた順に並べています。', open: false },
];
/* ---- エリアと院 ---- */
const NO_AREA = 'エリア未設定';
const shortStore = s => { const t = String(s || '').trim().split(/[\s\u3000]+/).pop() || ''; return t.replace(/^.*[-\uFF0D\u2010](?=.)/, '') || String(s || ''); }; // 「整体KOTOBUKI-寿- 千葉院」→「千葉院」
const keyOf = s => shortStore(s).replace(/院$/, '');
function normAreas(list) {
  return (Array.isArray(list) ? list : []).filter(a => a && a.name && Array.isArray(a.stores))
    .map(a => ({ name: String(a.name), stores: a.stores.map(x => String(x).trim()).filter(Boolean) }));
}
function parseAreas(text) {
  const out = [];
  for (const line of String(text).split(/\n/)) {
    const m = line.match(/^\s*(.+?)\s*[：:]\s*(.*)$/); if (!m) continue;
    const stores = m[2].split(/[・、,，\s\u3000]+/).map(x => x.trim()).filter(Boolean);
    if (stores.length) out.push({ name: m[1], stores });
  }
  return out;
}
const areaMemo = new Map();
function areaOf(store) {
  if (areaMemo.has(store)) return areaMemo.get(store);
  const k = shortStore(store); let hit = '';
  for (const a of state.areas) if (a.stores.some(x => { const q = keyOf(x); return q && k.includes(q); })) { hit = a.name; break; }
  areaMemo.set(store, hit); return hit;
}
const inArea = (store, name) => !name || (areaOf(store) || NO_AREA) === name;
const storeAsOf = s => (state.asOfByStore[s] !== undefined ? state.asOfByStore[s] : state.asOf);
const tanto = p => (state.single ? '' : shortStore(p.store) + '　') + '担当 ' + p.staff;
let wantArea = null; try { wantArea = localStorage.getItem('raiin-area'); } catch (e) { /* 保存領域が使えない環境では毎回「全エリア」から始まる */ }
function rememberArea() { try { localStorage.setItem('raiin-area', state.area); } catch (e) { /* 覚えられなくても画面は動く */ } }

const visible = () => model.patients.filter(p => p.last && p.tracked && inArea(p.store, state.area) && (!state.store || p.store === state.store));
const scoped = () => visible().filter(p => !state.staff || p.staff === state.staff);
const BY_LAST = ['ended', 'cancelled', 'nobook']; // 予約がない人は、最後の来院が古い順
const sorter = (a, b) => (SEVERITY[a.status] - SEVERITY[b.status]) || (a.status === 'away' ? b.last.day - a.last.day : 0) || (BY_LAST.includes(a.status) ? a.last.day - b.last.day : 0) || ((b.overdue || 0) - (a.overdue || 0)) || (a.last.day - b.last.day);

function ticketText(p) {
  const t = p.tk;
  if (!t) return p.isNew ? '新規・回数券なし' : '回数券なし';
  if (done(p)) return t.type + ' 終了';
  return p.used !== null ? `${t.type} ${p.used}/${t.N}回` : `${t.type} 回数不明`;
}
function detail(p) {
  const a = p.asOf, since = a - p.last.day, b = p.booking;
  const bk = b ? `次回は ${mdw(b.day)}` : '';
  switch (p.status) {
    case 'ended': return `最後の来院から${since}日。${b ? bk : '次回予約なし'}`;
    case 'away': return `最後の来院から${since}日。${done(p) ? '回数券は終了' : p.remaining !== null ? `回数券が${p.remaining}回残っています` : '回数券の残りは不明'}${p.was === 'cancelled' ? '。予約をキャンセルしたまま' : ''}`;
    case 'cancelled': return `${md(p.cancelledNext)} の予約をキャンセル。最後の来院から${since}日`;
    case 'nobook':
      if (since === 0) return `${md(p.last.day)} に来院。次の予約がまだ入っていません`;
      if (!p.tk || p.target === null) return `最後の来院から${since}日`;
      if (p.target - p.last.day <= 0) return `最後の来院から${since}日`;
      return `最後の来院から${since}日（目安は${p.target - p.last.day}日ごと）`;
    case 'late': return p.target !== null ? `${bk}。目安日 ${md(p.target)} より${b.day - p.target}日先` : `${bk}。前回から${b.day - p.last.day}日空きます`;
    case 'ok': return `${bk}。前回から${b.day - p.last.day}日`;
    default: return '';
  }
}

/* ---- 上部 ---- */
function renderChrome() {
  areaMemo.clear();
  const all = model.patients.filter(p => p.last && p.tracked), dataStores = model.stores;
  const hasAreas = state.areas.length > 0, attn = ps => ps.filter(p => ATTN.includes(p.status)).length;
  const areaNames = state.areas.map(a => a.name);
  if (hasAreas && dataStores.some(s => !areaOf(s))) areaNames.push(NO_AREA);
  if (state.area && !areaNames.includes(state.area)) state.area = '';
  const withData = name => dataStores.filter(s => inArea(s, name));

  const ab = $('#areaBar'); ab.hidden = !hasAreas;
  ab.innerHTML = hasAreas ? [''].concat(areaNames).map(n => {
    const has = withData(n).length;
    return `<button data-area="${esc(n)}" aria-pressed="${n === state.area}"><span>${n ? esc(n) : '全エリア'}</span><small>${has ? '要フォロー ' + attn(all.filter(p => inArea(p.store, n))) + '人' : 'データなし'}</small></button>`;
  }).join('') : '';

  /* いまの範囲に含まれる院（エリアを選んだときは、まだCSVがない院も並べる） */
  let list = [];
  if (state.area) {
    const conf = (state.areas.find(a => a.name === state.area) || { stores: [] }).stores, wd = withData(state.area), seen = new Set();
    for (const c of conf) { const full = wd.find(s => shortStore(s).includes(keyOf(c))); if (full) { if (seen.has(full)) continue; seen.add(full); } list.push({ full: full || '', short: full ? shortStore(full) : c, has: !!full }); }
    for (const s of wd) if (!seen.has(s)) list.push({ full: s, short: shortStore(s), has: true });
  } else if (!hasAreas && dataStores.length > 1) list = dataStores.map(s => ({ full: s, short: shortStore(s), has: true }));
  if (state.store && !dataStores.includes(state.store)) state.store = '';
  if (state.store && list.length && !list.some(x => x.full === state.store)) state.store = '';
  state.storeList = list;
  const scopeStores = state.store ? [state.store] : withData(state.area);
  state.single = scopeStores.length === 1 ? scopeStores[0] : '';

  const sb = $('#storeBar'); sb.hidden = !list.length;
  sb.innerHTML = list.length ? `<button class="chip" data-store="" aria-pressed="${!state.store}">${state.area ? 'エリア全体' : 'すべての院'}</button>` + list.map(x => x.has
    ? `<button class="chip" data-store="${esc(x.full)}" aria-pressed="${x.full === state.store}">${esc(x.short)} <b>${attn(all.filter(p => p.store === x.full))}</b></button>`
    : `<button class="chip" disabled>${esc(x.short)} <small>データなし</small></button>`).join('') : '';

  $('#storeName').textContent = state.store ? shortStore(state.store) : state.area ? state.area : hasAreas ? '全エリア' : (dataStores.length > 1 ? `${dataStores.length}院` : (dataStores[0] || 'データ未読込'));
  const sd = model.settings.startDay ? toDay(model.settings.startDay) : null;
  const when = state.single ? `${mdw(storeAsOf(state.single))} 時点のデータ` : `${scopeStores.length}院のデータ`;
  $('#asOfLabel').textContent = model.counts.res ? `${when}　${sd !== null && sd >= model.dataStart ? md(sd) + ' 以降に回数券を買った患者さん' : '回数券で通っている患者さん'} ${visible().length}人` : '';
  const today = todayDay();
  const stale = scopeStores.filter(s => today - storeAsOf(s) >= 3).sort((x, y) => storeAsOf(x) - storeAsOf(y));
  const warn = $('#warn');
  let w = '';
  if (state.dbState === 'loading') w = '読み込み中です…' + (state.loadProg ? ' ' + state.loadProg : '');
    else if (state.dbState === 'error') w = 'データを読み込めませんでした。ページを開き直してください。';
  else if (stale.length && state.single) w = `データは${today - storeAsOf(state.single)}日前（${md(storeAsOf(state.single))}）のものです。新しいCSVを入れると最新になります。`;
  else if (stale.length) w = `データが3日以上前の院があります：${stale.slice(0, 6).map(s => `${shortStore(s)}（${md(storeAsOf(s))}）`).join('、')}${stale.length > 6 ? ` ほか${stale.length - 6}院` : ''}。新しいCSVを入れると最新になります。`;
  warn.innerHTML = esc(w) + (stale.length && state.dbState === 'ready' && canUpload() && state.tab !== 'csv' ? ' <button class="lk" data-tab="csv">CSVを入れる</button>' : ''); warn.hidden = !w;

  /* 担当者の切り替えは、1つの院に絞れているときだけ出す */
  const stb = $('#staffBar');
  if (!state.single) { state.staff = ''; stb.hidden = true; stb.innerHTML = ''; }
  else {
    const tk = visible().filter(p => p.isTicket);
    const staffs = [...new Set(visible().map(p => p.staff))].sort((a, b) => tk.filter(p => p.staff === b).length - tk.filter(p => p.staff === a).length);
    if (!staffs.includes(state.staff)) state.staff = '';
    const cnt = s => tk.filter(p => (!s || p.staff === s) && ATTN.includes(p.status)).length;
    stb.hidden = !staffs.length;
    stb.innerHTML = staffs.length ? [''].concat(staffs).map(s => `<button data-staff="${esc(s)}" aria-pressed="${s === state.staff}"><span>${s ? esc(s) : '全員まとめて'}</span><small>要フォロー ${cnt(s)}人</small></button>`).join('') : '';
  }
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === state.tab));
}
function emptyHTML() {
  if (state.dbState === 'loading') return '<div class="list"><div class="empty">読み込み中です…</div></div>';
  if (!model.counts.res) return `<div class="list"><div class="empty">${canUpload() ? 'データがありません。上の「CSVを入れる」から、Quick ReserveのCSVを入れてください。' : 'まだデータが入っていません。エリマネか管理者がCSVを入れると、ここに表示されます。'}</div></div>`;
  if (state.area && !state.storeList.some(x => x.has)) return '<div class="list"><div class="empty">このエリアのCSVは、まだ読み込まれていません。上の「CSVを入れる」から、このエリアの院のCSVを入れてください。</div></div>';
  if (!visible().length) return `<div class="list"><div class="empty">${model.settings.startDay ? md(toDay(model.settings.startDay)) + ' 以降に' : ''}回数券を買った患者さんは、まだいません。購入があった日のCSVを読み込むと、ここに並びます。</div></div>`;

/* LINE・手紙の結果：直近90日に送った記録と、そのあとの来院 */
/* 送ったときの状況：これからの記録は送った時点の状況を残す。前からの記録は、来院データからさかのぼって推定する */
const CT_GROUPS = [['cancelled', 'キャンセルしたまま'], ['nobook', '次回予約なし'], ['away', 'しばらく来ていない'], ['other', 'その他']];
const ctGroup = s => (s === 'cancelled' || s === 'nobook' || s === 'away' ? s : 'other');
function statusAt(p, c) {
  if (c.s) return ctGroup(c.s);
  const d = toDay(c.d), before = p.visits.filter(v => v.day <= d);
  if (!before.length) return 'other';
  const lv = before[before.length - 1].day;
  if (d - lv >= model.settings.awayDays) return 'away';
  if ((p.cancels || []).some(x => x > lv && x <= d + 14)) return 'cancelled';
  return 'nobook';
}
const CT_WINDOW = 30; // 送ってから何日以内の来院を「戻った」に数えるか
/* 戻った：送ってから30日以内に来院した、または次の予約が入っている */
const cameBack = (p, c) => { const d = toDay(c.d); return p.visits.some(v => v.day > d && v.day <= d + CT_WINDOW) || !!(p.booking && p.booking.day > d); };
const waiting = (p, c) => !cameBack(p, c) && model.asOf - toDay(c.d) < CT_WINDOW;
function contactTable() {

  for (const p of ps) for (const c of contactsOf(p)) if (toDay(c.d) >= cut) recs.push({ p, c, g: statusAt(p, c), back: cameBack(p, c), wait: waiting(p, c), m: c.m === 'letter' ? 'letter' : 'line' });
  if (!recs.length) return '';
  const cell = l => { const n = l.length, b = l.filter(r => r.back).length; return n ? `<b>${b}</b>/${n}人<small class="pct">${Math.round(b / n * 100)}%</small>` : '<span style="color:var(--sub)">—</span>'; };

  const head = first => `<tr><th>${first}</th><th class="r">LINE</th><th class="r">手紙</th><th class="r">合計</th></tr>`;
  const groups = CT_GROUPS.filter(([k]) => recs.some(r => r.g === k));

  const nWait = recs.filter(r => r.wait).length;

    <h3 class="cth">送ったときの状況ごと</h3>

    ${byKey.size ? `<h3 class="cth">${state.single ? '担当ごと' : '院ごと'}</h3>

    <p class="note" style="margin-top:8px">人数が少ないうちは、割合が大きく動きます。人数とあわせて見てください。${nWait ? `送ってから${CT_WINDOW}日たっていない ${nWait}件は、まだ結果待ちです（戻っていない人に数えています）。` : ''}前からの記録の「送ったときの状況」は、来院データから推定しています。</p></div>`;
}

/* ---- 更新見込み ---- */

  let left = `<div class="card"><h2>回数券が終了する見込み</h2>
    <p>今のペースで通った場合に最後の1回が来る月です。次回予約がある人は予約日から、ない人は目安日から数えています。</p>`;
  if (!keys.length) left += '<div class="empty">対象の患者さんがまだいません。</div>';
  else {
    left += '<div class="bars">' + keys.map(k => `<button class="brow" data-month="${k}" aria-pressed="${k === state.month}"><span>${mlabel(k)}</span><span><i style="width:${months.get(k).length / max * 100}%"></i></span><span>${months.get(k).length}人</span></button>`).join('') + '</div>';
    const ps = months.get(state.month).slice().sort((a, b) => a.endDay - b.endDay);
    left += `<h3 style="font-size:14px;margin:18px 0 0">${mlabel(state.month)}に終了する見込みの患者さん</h3><div class="mini">` +
      ps.map(p => `<button data-id="${esc(p.id)}"><span><b>${esc(pname(p))}</b> <small>${esc(tanto(p))}</small></span><span>${esc(p.tk.type)} 残り${p.remaining}回 <small>${md(p.endDay)}頃</small></span></button>`).join('') + '</div>';
  }
  left += '</div>';

  const sd0 = model.settings.startDay ? toDay(model.settings.startDay) : null;
  const rp = model.renewPoints.filter(x => x.p.last && x.t.known && (sd0 === null || x.t.start >= sd0) && (!state.staff || x.p.staff === state.staff) && inArea(x.p.store, state.area) && (!state.store || x.p.store === state.store));
  const yes = rp.filter(x => x.renewed).length, no = rp.length - yes;
  let right = `<div class="card"><h2>更新のタイミングを迎えた患者さん</h2>
    <p>対象の回数券で最後の1回（「回数券更新」の施術）を受けた人と、そのあと回数券を購入したかどうかです。</p>`;
  if (!rp.length) right += '<div class="empty">該当する患者さんはいません。</div>';
  else {
    right += `<div class="kv"><span><b>${rp.length}</b>人が更新のタイミング</span><span><b>${yes}</b>人が更新</span><span><b>${no}</b>人は更新せず終了</span></div>
      <div class="split" role="img" aria-label="更新${yes}人、更新せず終了${no}人"><i class="a" style="width:${yes / rp.length * 100}%"></i><i class="b" style="width:${no / rp.length * 100}%"></i></div>`;
    if (no) right += `<h3 style="font-size:14px;margin:16px 0 0">更新せず終了した${no}人</h3><div class="mini">` +
      rp.filter(x => !x.renewed).sort((a, b) => a.t.endDay - b.t.endDay).map(x => `<button data-id="${esc(x.p.id)}"><span><b>${esc(pname(x.p))}</b> <small>${esc(tanto(x.p))}</small></span><span>${esc(x.t.type)} <small>${md(x.t.endDay)} が最後の1回・次回予約${x.p.booking ? 'あり' : 'なし'}</small></span></button>`).join('') + '</div>';
  }
  right += '</div>';
  const soon = act.filter(p => p.renewSoon).sort((x, y) => x.remaining - y.remaining);
  let top = `<p class="guide">この先、いつ・何人の回数券が終了するかの見込みと、すでに更新のタイミングを迎えた人の結果です。</p>`;
  if (soon.length) top += `<div class="card" style="margin-bottom:20px"><h2>そろそろ更新の声かけをする患者さん</h2><p>回数券の残りが${model.settings.soon}回以下です。</p><div class="mini">` +
    soon.map(p => `<button data-id="${esc(p.id)}"><span><b>${esc(pname(p))}</b> <small>${esc(tanto(p))}</small></span><span>${esc(p.tk.type)} 残り${p.remaining}回 <small>${p.booking ? '次回 ' + mdw(p.booking.day) : '次回予約なし'}</small></span></button>`).join('') + '</div></div>';
  return `${top}<div class="grid2">${left}${right}</div>`;
}

/* ---- 患者さんの詳細 ---- */
function calendarsHTML(p) {
  const a = p.asOf, tol = model.settings.tol;
  const marks = new Map(); const put = (d, c) => marks.set(d, ((marks.get(d) || '') + ' ' + c).trim());
  const showT = p.target !== null && !done(p);
  if (showT) for (let d = p.target - tol; d <= p.target + tol; d++) put(d, 'win' + (!p.booking && a > p.target + tol ? ' over' : ''));
  for (const c of p.cancels) put(c, 'cx');
  for (const v of p.visits) put(v.day, 'v' + (v.renewItem && !v.buys.length ? ' end' : ''));
  if (p.booking) put(p.booking.day, 'bk');
  put(a, 'td');
  const ds = [...p.visits.map(v => v.day), ...p.cancels, a]; if (p.booking) ds.push(p.booking.day); if (showT) ds.push(p.target);
  let first = dayToDate(Math.min(...ds)), last = dayToDate(Math.max(...ds));
  const lim = new Date(Date.UTC(last.getUTCFullYear(), last.getUTCMonth() - 3, 1)); if (first < lim) first = lim; // 長く通っている人は、直近4か月を表示する
  let y = first.getUTCFullYear(), m = first.getUTCMonth(), out = '', guard = 0;
  while ((y < last.getUTCFullYear() || (y === last.getUTCFullYear() && m <= last.getUTCMonth())) && guard++ < 4) {
    const start = Math.round(Date.UTC(y, m, 1) / DAY_MS), len = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const pad = (dayToDate(start).getUTCDay() + 6) % 7;
    let g = ['月', '火', '水', '木', '金', '土', '日'].map(w => `<span class="w">${w}</span>`).join('') + '<span></span>'.repeat(pad);
    for (let i = 0; i < len; i++) g += `<span class="c ${marks.get(start + i) || ''}">${i + 1}</span>`;
    out += `<div class="cal"><h4>${y}年${m + 1}月</h4><div class="g">${g}</div></div>`;
    m++; if (m > 11) { m = 0; y++; }
  }
  const over = showT && !p.booking && a > p.target + tol;
  const lg = `<div class="legend cal-lg">
    <span><i class="sw v"></i>来院した日</span>
    ${p.booking ? '<span><i class="sw bk"></i>次回予約</span>' : ''}
    ${p.cancels.length ? '<span><b class="cx">12</b>キャンセルした日</span>' : ''}
    ${showT ? `<span><i class="sw win${over ? ' over' : ''}"></i>${over ? '来てほしかった時期（予約なし）' : '次に来てほしい時期'}（目安日 ${md(p.target)} の前後${tol}日）</span>` : ''}
    <span><i class="sw td"></i>データの基準日（${md(a)}）</span></div>`;
  return `<div class="cals">${out}</div>${lg}`;
}

/* ---- CSV読み込み ---- */
async function loadFiles(files) {
  if (!canUpload()) { flash('CSVを入れられるのは、エリマネと管理者です。'); return; }
  const parsed = [], msgs = [];
  for (const f of files) {
    const buf = await f.arrayBuffer();
    let t = parseCSV(new TextDecoder('utf-8').decode(buf)), type = detectType(t.cols);
    if (!type) { try { t = parseCSV(new TextDecoder('shift_jis').decode(buf)); type = detectType(t.cols); } catch (e) { /* 対応していない文字コード */ } }
    if (!type) msgs.push(`${esc(f.name)}：見出しを読み取れませんでした。Quick Reserveから出力したままのCSVを選んでください。`);
    else if (type === 'スタッフ') msgs.push(`${esc(f.name)}：スタッフデータは使いません（担当者名は予約データから取ります）。`);
    else parsed.push({ f, t, type });
  }
  const skipped = new Set(), asOfNew = {};
  for (const { f, t, type } of parsed) {
    let which = '';
    if (type === '予約') {
      const si = t.cols.indexOf('店舗名'), all = si < 0 ? [] : [...new Set(t.rows.map(r => (r[si] || '').trim()).filter(Boolean))];
      const ok = all.filter(canUploadStore);
      for (const x of all) if (!ok.includes(x)) skipped.add(shortStore(x));
      if (si >= 0) t.rows = t.rows.filter(r => ok.includes((r[si] || '').trim())); // 担当していない院の行は入れない
      const m = f.name.normalize('NFC').match(/出力(\d{2})(\d{2})(\d{2})/);
      const d = m ? toDay(`20${m[1]}-${m[2]}-${m[3]}`) : todayDay();
      if (d !== null) for (const x of ok) if (asOfNew[x] === undefined || d > asOfNew[x]) asOfNew[x] = d;
      which = ok.length ? `（${ok.map(x => esc(shortStore(x))).join('、')}）` : '';
    }
    const n = ingest(data, type, t);
    msgs.push(`${esc(f.name)}：${type} ${n}件${which}を読み込みました。`);
  }
  if (skipped.size) msgs.push(`<b>${[...skipped].map(esc).join('、')}</b> は担当の院ではないため、保存していません。`);
  /* 今回のファイルに関係する院を探す */
  const touched = new Set(Object.keys(asOfNew));
  const custStores = new Map(); for (const r of data.res.values()) { if (!custStores.has(r.cust)) custStores.set(r.cust, new Set()); custStores.get(r.cust).add(r.store); }
  for (const { t, type } of parsed) {
    const ix = c => t.cols.indexOf(c);
    if (type === '精算') { const i = ix('予約ID'); for (const r of t.rows) { const x = data.res.get((r[i] || '').trim()); if (x) touched.add(x.store); } }
    else if (type === '精算アイテム') { const i = ix('会計ID'); for (const r of t.rows) { const p = data.pay.get((r[i] || '').trim()); const x = p && data.res.get(p.res); if (x) touched.add(x.store); } }
    else if (type === '顧客') { const i = ix('顧客ID'); for (const r of t.rows) { const ss = custStores.get((r[i] || '').trim()); if (ss) for (const x of ss) touched.add(x); } }
  }
  const targets = [...touched].filter(canUploadStore);
  const src = { res: new Map(data.res), pay: new Map(data.pay), items: new Map(data.items), cust: new Map(data.cust) }; // 保存中に画面が読み込み直しても、今回のCSVが消えないよう写しを取っておく
  state.loadMsg = msgs.join('<br>');
  rebuild(); render();
  if (!targets.length) return;
  enqueue(async () => {
    try {
      for (const full of targets) {
        const a = asOfNew[full] !== undefined ? Math.max(asOfNew[full], (storeData[sid(full)] && storeData[sid(full)].asOf) || 0) : ((storeData[sid(full)] && storeData[sid(full)].asOf) || todayDay());
        await saveStore(full, src, a);
      }
      mergeAll(); rebuild();
      flash(`保存しました（${targets.map(shortStore).join('、')}）。ほかの人の画面にも反映されます。`);
    } catch (e) { flash(denied(e) ? '保存する権限がありませんでした。担当の院か確認してください。' : '保存できませんでした。もう一度読み込んでください。'); }
  });
}

/* ---- Claude版からの引っ越し（管理者・最初の1回） ---- */
async function importMigration(file) {
  if (!isAdmin()) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { flash('ファイルを読めませんでした。'); return; }
  if (!j || j.kind !== 'kotobuki-migrate' || !j.stores) { flash('引っ越し用のファイルではありません。'); return; }
  enqueue(async () => {
    try {
      const names = Object.keys(j.stores); let i = 0;
      for (const s of names) {
        const x = j.stores[s], d = emptyData();
        for (const type of Object.keys(x.csv || {})) ingest(d, type, parseCSV(x.csv[type]));
        flash(`移しています… ${++i}/${names.length}（${s}）`);
        await saveStore(x.name, d, toDay(x.asOf) || todayDay(), `移しています ${i}/${names.length} ${s}`);
      }
      for (const s of Object.keys(j.contacts || {})) await FB.set('contacts/' + s, { p: j.contacts[s] }, true);
      for (const s of Object.keys(j.pace || {})) await FB.set('pace/' + s, { p: j.pace[s] }, true);
      if (j.settings) await FB.set('config/settings', Object.assign({}, DEFAULT_SETTINGS, j.settings));
      if (Array.isArray(j.areas)) await FB.set('config/areas', { list: j.areas });
      mergeAll(); rebuild();
      flash(`Claude版のデータを移しました（${names.length}院）。`);
    } catch (e) { flash('途中で止まりました。もう一度ファイルを入れてください（入れ直しても重複はしません）。'); }
  });
}

}

        <div class="storepick">${choices.map(k => `<label class="ck"><input type="checkbox" name="st" value="${esc(k)}"${checked.has(k) ? ' checked' : ''}>${esc(k)}${isAdmin() && areaOfShort(k) ? `<small>${esc(areaOfShort(k))}</small>` : ''}</label>`).join('') || '<span style="color:var(--sub)">選べる院がありません。</span>'}</div>
        ${isAdmin() ? '<p class="hint">管理者は、ここで選ばなくても全部の院を見られます。</p>' : ''}
      </fieldset>

    </form></div>
  <div class="card"><h2>登録されている人 <small style="color:var(--sub);font-weight:400">${list.length}人</small></h2>
    <table class="memtbl"><tbody>${list.map(m => `<tr><td><b>${esc(m.name || '')}</b><br><small>${esc(m.email)}</small></td><td><span class="role r-${esc(m.role)}">${ROLE[m.role] || esc(m.role)}</span></td>
      <td class="st">${m.role === 'admin' ? '全部の院' : (m.stores || []).map(x => `<span class="nw">${esc(x)}</span>`).join('・') || '<span style="color:var(--sub)">なし</span>'}</td>

function memberOf(email) { const x = (state.members || []).find(m => m.id === email); return x ? Object.assign({ email }, x.data) : null; }
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fMem') return;

const col = p => collection(fs, ...p.split('/'));
const back = url => (url ? { url } : undefined);
const randomPw = () => { const a = new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a, b => b.toString(36).padStart(2, '0')).join('') + 'Aa1!'; };

window.fbReady(Object.freeze({
  auth,
  onAuth: cb => onAuthStateChanged(auth, cb),
  signIn: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
  signOut: () => signOut(auth),
  reset: (email, url) => sendPasswordResetEmail(auth, email, back(url)),
  signUp: async (email, pw, url) => { const c = await createUserWithEmailAndPassword(auth, email, pw); await sendEmailVerification(c.user, back(url)); return c.user; },
  resendVerify: url => sendEmailVerification(auth.currentUser, back(url)),
  refresh: async () => { await reload(auth.currentUser); await auth.currentUser.getIdToken(true); return auth.currentUser; },
  /* 別の人のアカウントを作る。自分のログインが切り替わらないよう、別の接続で作ってすぐ閉じる */
  createAccount: async (email, url) => {
    const a2 = initializeApp(config, 'add-' + Date.now()), au2 = getAuth(a2);
    let created = true;
    try { await createUserWithEmailAndPassword(au2, email, randomPw()); }
    catch (e) { if (e.code !== 'auth/email-already-in-use') { await deleteApp(a2).catch(() => {}); throw e; } created = false; }
    await signOut(au2).catch(() => {}); await deleteApp(a2).catch(() => {});
    await sendPasswordResetEmail(auth, email, back(url));
    return created;
  },
  get: async p => { const s = await getDoc(ref(p)); return s.exists() ? s.data() : null; },
  set: (p, d, merge) => (merge ? setDoc(ref(p), d, { merge: true }) : setDoc(ref(p), d)),
  del: p => deleteDoc(ref(p)),
  watch: (p, cb, err) => onSnapshot(ref(p), s => cb(s.exists() ? s.data() : null, s.metadata.hasPendingWrites), err),
  watchList: (p, cb, err) => onSnapshot(col(p), s => cb(s.docs.map(d => ({ id: d.id, data: d.data() }))), err),
  list: async p => (await getDocs(col(p))).docs.map(d => ({ id: d.id, data: d.data() })),
}));
</script>
</body>
</html>
